<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Reconstitution 3D — Ancrage Hybride</title>
  <link rel="stylesheet" href="./css/style.css" />

  <!-- Import Map pour Three.js et MindAR (versions compatibles ES Modules) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <!-- Conteneur MindAR (Phase 1) -->
  <div id="mindar-container"></div>

  <!-- Interface utilisateur superposée (HUD) -->
  <div id="hud">
    <div id="status-banner">Initialisation de la caméra...</div>
    
    <!-- Viseur central pendant la recherche de l'image au sol -->
    <div id="reticle-guide">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <span>Visez le marqueur au sol</span>
    </div>

    <div id="controls">
      <button id="btn-lock" class="btn primary hidden">Verrouiller et explorer à 360°</button>
      <button id="btn-reset" class="btn secondary hidden">Recaler sur le marqueur</button>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
